name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true
      - run: uv pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not metal"
